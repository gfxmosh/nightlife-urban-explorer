
name: Nightlife Automatic Map Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightlife-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh geographical data
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        run: |
          python3 -u <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import pathlib

          lat, lon = 52.5055, 13.3788
          radius = 2000
          area = f"(around:{radius},{lat},{lon})"

          query = f"""
          [out:json][timeout:90];
          (
            node[highway=street_lamp]{area};
            nwr[amenity=bench]{area};
            nwr[leisure=park]{area};
            nwr[amenity~"^(restaurant|cafe|bar|pub|fast_food)$"]{area};
            nwr[railway~"^(station|halt|subway_entrance)$"]{area};
            nwr[tourism~"^(attraction|museum)$"]{area};
          );
          out center;
          """

          servers = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.private.coffee/api/interpreter"
          ]

          for server in servers:
              try:
                  body = urllib.parse.urlencode(
                      {"data": query}
                  ).encode()

                  request = urllib.request.Request(
                      server,
                      data=body,
                      headers={
                          "User-Agent": "NightlifeUrbanExplorer/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request, timeout=120
                  ) as response:
                      data = json.load(response)

                  if not data.get("elements") or data.get("remark"):
                      raise ValueError("Incomplete dataset")

                  data["nightfall_scope"] = {
                      "center": [lon, lat],
                      "radius": radius
                  }

                  path = pathlib.Path("data/osm.json")
                  path.parent.mkdir(exist_ok=True)
                  temp = path.with_suffix(".tmp")
                  temp.write_text(json.dumps(data))
                  temp.replace(path)

                  print("Imported features:", len(data["elements"]))
                  break

              except Exception as error:
                  print(server, error)

          else:
              print("Refresh unavailable. Keeping saved dataset.")
          PY

      - name: Validate saved dataset
        run: |
          python3 - <<'PY'
          import json
          with open("data/osm.json") as f:
              data = json.load(f)
          assert isinstance(data.get("elements"), list)
          assert len(data["elements"]) > 0
          assert not data.get("remark")
          print("Available features:", len(data["elements"]))
          print("Research scope:", data.get("nightfall_scope"))
          PY

      - name: Preserve updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh geographical data"
            git push
          fi

      - name: Prepare website
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/osm.json _site/data/osm.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
