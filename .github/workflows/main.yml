
name: Nightlife Automatic Map Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightlife-map
  cancel-in-progress: false

jobs:
  update-map-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch OpenStreetMap data
        if: ${{ github.event_name == 'schedule' || hashFiles('data/osm.json') == '' }}
        continue-on-error: true
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import urllib.parse
          import pathlib
          import time

          lat, lon = 52.5055, 13.3788
          radius = 2000
          area = f"(around:{radius},{lat},{lon})"

          query = f"""
          [out:json][timeout:120];
          (
            node[highway=street_lamp]{area};
            nwr[amenity=bench]{area};
            nwr[leisure=park]{area};
            nwr[amenity~"^(restaurant|cafe|bar|pub|fast_food)$"]{area};
            nwr[railway~"^(station|halt|subway_entrance)$"]{area};
            nwr[tourism~"^(attraction|museum)$"]{area};
          );
          out center;
          """

          servers = [
              "https://overpass-api.de/api/interpreter",
              "https://overpass.kumi.systems/api/interpreter",
              "https://overpass.private.coffee/api/interpreter"
          ]

          for server in servers:
              try:
                  body = urllib.parse.urlencode(
                      {"data": query}
                  ).encode()

                  request = urllib.request.Request(
                      server,
                      data=body,
                      headers={
                          "User-Agent": "NightlifeUrbanExplorer/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request, timeout=180
                  ) as response:
                      data = json.load(response)

                  if not data.get("elements") or data.get("remark"):
                      raise ValueError("Incomplete dataset")

                  data["nightfall_scope"] = {
                      "center": [lon, lat],
                      "radius": radius
                  }

                  pathlib.Path("data").mkdir(exist_ok=True)
                  pathlib.Path("data/osm.json").write_text(
                      json.dumps(data), encoding="utf-8"
                  )

                  print("Successfully imported:",
                        len(data["elements"]), "features")
                  break

              except Exception as error:
                  print(server, error)
                  time.sleep(15)

          else:
              raise SystemExit("All data servers failed")
          PY

      - name: Save geographical dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/osm.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh urban research data"
            git push
          fi

      - name: Prepare website
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/osm.json _site/data/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy updated website
        uses: actions/deploy-pages@v4
